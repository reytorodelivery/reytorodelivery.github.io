<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Rey Toro Delivery · Haz tu pedido aquí</title>
<meta name="description" content="Frutas y verduras a tu casa. Despacho gratis desde $25.000.">

<!-- Vista previa en WhatsApp / Facebook -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rey Toro Delivery">
<meta property="og:title" content="Rey Toro Delivery · Haz tu pedido aquí">
<meta property="og:description" content="Frutas y verduras a tu casa. Despacho gratis desde $25.000.">
<meta property="og:url" content="https://reytorodelivery.github.io/">
<meta property="og:image" content="https://reytorodelivery.github.io/preview2.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1c1b19">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>
  html, body { margin: 0; height: 100%; background: #faf6ee; overflow: hidden; }
  /* La página de pedidos se muestra aquí adentro: la dirección sigue siendo reytorodelivery.github.io */
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .cargando { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #1c1b19; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    text-align: center; padding: 24px; transition: opacity .3s; z-index: 2; }
  .cargando img { width: 120px; height: 120px; border-radius: 50%; box-shadow: 0 0 0 5px #e8742f; }
  .cargando p { color: #d9d2c5; margin: 18px 0 20px; font-size: 17px; }
  .cargando a { color: #fff; background: #e8742f; text-decoration: none; font-weight: 800; padding: 13px 24px; border-radius: 12px; display: none; }
  .cargando.lento a { display: inline-block; }
  .cargando.listo { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div class="cargando" id="cargando">
    <img src="icon.png" alt="Rey Toro Delivery">
    <p>Cargando la lista de precios…</p>
    <a id="directo" href="https://script.google.com/macros/s/AKfycbw9jldC5u71I1QHcgpF6_VgRan_Rk_fHt7sTlgxP2muko3AFzGcpexsz66x50bYANTVHg/exec" target="_top">Si no carga, toca aquí</a>
  </div>
  <iframe id="app" title="Rey Toro Delivery · Haz tu pedido"
    src="https://script.google.com/macros/s/AKfycbw9jldC5u71I1QHcgpF6_VgRan_Rk_fHt7sTlgxP2muko3AFzGcpexsz66x50bYANTVHg/exec"
    allow="clipboard-write"></iframe>
  <script>
    var c = document.getElementById('cargando');
    document.getElementById('app').addEventListener('load', function () { c.classList.add('listo'); });
    setTimeout(function () { c.classList.add('lento'); }, 8000);
  </script>
</body>
</html>
